name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-and-gui:
    name: Native safety and bundle / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install Linux GUI and compiler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth build-essential
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_native.py
      - name: Run all 25 tests with virtual desktop
        if: runner.os == 'Linux'
        run: xvfb-run -a env GUI_TESTS=1 python -m unittest discover -s tests -v
      - name: Run native safety tests on macOS
        if: runner.os == 'macOS'
        run: python -m unittest discover -s tests -v
      - name: Verify PyInstaller build (not a binary release)
        run: python -m PyInstaller packaging/fileorganiser.spec
